  #Routing
  go_router: ^17.3.0
  passkeys: ^2.21.1
  injectable: ^3.0.0
  injectable_generator: ^3.0.2
       

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  json_serializable: ^6.14.0
 
# The following section is specific to Flutter packages.
flutter:
